name: houji iPhone 23G90 kernel and firmware

on:
  push:
    branches: [main, houji/ios26/ufs-gpt-build-check]
    paths:
      - '.github/workflows/houji-public-ram.yml'
      - 'ci/houji-public-ram/**'
  workflow_dispatch:
    inputs:
      native_volume:
        description: Authenticated encrypted HFSX identity for offline native root
        type: string
        required: false

run-name: houji 23G90 ${{ github.ref_name == 'houji/ios26/ufs-gpt-build-check' && 'UFS GPT compile check' || (inputs.native_volume != '' && 'native-root-offline' || 'RAM-only') }}

env:
  HOUJI_NATIVE_VOLUME_SEALED: ${{ inputs.native_volume }}
  HOUJI_UFS_GPT_COMPILE_CHECK: ${{ github.ref_name == 'houji/ios26/ufs-gpt-build-check' && '1' || '0' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOUJI_PUBLIC_REVISION: 98bc0960f96076de8e8d16efcfb0c0603b166b85
      HOUJI_JOBS: '6'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the pinned evidence tool
        if: env.HOUJI_UFS_GPT_COMPILE_CHECK != '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/houji-artifact-venv"
          "$RUNNER_TEMP/houji-artifact-venv/bin/pip" -q install cryptography==50.0.2

      - name: Authenticate the encrypted volume identity
        if: inputs.native_volume != '' && env.HOUJI_UFS_GPT_COMPILE_CHECK != '1'
        shell: bash
        env:
          HOUJI_ARTIFACT_KEY: ${{ secrets.HOUJI_PUBLIC_RAM_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          umask 077
          volume="$RUNNER_TEMP/native-volume.json"
          "$RUNNER_TEMP/houji-artifact-venv/bin/python" ci/houji-public-ram/native-volume-envelope.py --output "$volume"
          echo "HOUJI_NATIVE_VOLUME=$volume" >> "$GITHUB_ENV"

      - name: Verify SDK and prepare pinned source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          bash ci/houji-public-ram/assemble.sh 2>&1 | tee evidence/assemble.log

      - name: Verify the board firmware inputs
        shell: bash
        env:
          HOUJI_SQE_A: ${{ secrets.HOUJI_PUBLIC_RAM_SQE_A }}
          HOUJI_SQE_B: ${{ secrets.HOUJI_PUBLIC_RAM_SQE_B }}
        run: |
          set -euo pipefail
          python3 ci/houji-public-ram/firmware.py 2>&1 | tee evidence/firmware.log

      - name: Compile and verify the native-root arm64e kernel (offline)
        if: inputs.native_volume != '' && env.HOUJI_UFS_GPT_COMPILE_CHECK != '1'
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/houji-public-ram"
          HOUJI_XNU="$base/xnu" HOUJI_REFERENCE="$base/hakios" \
            bash ci/houji-public-ram/build-native-kernel.sh 2>&1 | tee evidence/kernel.log

      - name: Compile and verify the RAM-only arm64e kernel and PID1
        if: inputs.native_volume == '' || env.HOUJI_UFS_GPT_COMPILE_CHECK == '1'
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/houji-public-ram"
          export XNU_SRC="$base/xnu" XNU_ARCH=arm64e MACHINE=HOUJI RC_DARWIN_KERNEL_VERSION=25.6.0
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          cp "$sdk/System/Library/Frameworks/Kernel.framework/Headers/IOKit/hid/IOHIDUsageTables.h" \
            "$XNU_SRC/iokit/Kernel/arm/hid/IOHIDUsageTables.h"
          bash "$base/hakios/base/xnu-deps/setup.sh" --stage1 2>&1 | tee evidence/setup-stage1.log
          bash "$base/hakios/base/xnu-deps/setup.sh" --stage2 2>&1 | tee evidence/setup-stage2.log
          HOUJI_XNU="$XNU_SRC" HOUJI_REFERENCE="$base/hakios" \
            bash "$base/houji/tools/build-ios26-kernel.sh" --ram-only 2>&1 | tee evidence/kernel.log
          if [[ "$HOUJI_UFS_GPT_COMPILE_CHECK" == 1 ]]; then
            bash ci/houji-public-ram/check-ufs-gpt-kernel.sh "$XNU_SRC" 2>&1 | tee evidence/ufs-gpt-compile.log
            exit 0
          fi
          python3 "$base/houji/tools/build-ios26-first-entry.py" --output "$base/hello.macho" \
            2>&1 | tee evidence/pid1.log
          cp "$base/hello.json" evidence/pid1.json

      - name: Hash and encrypt compiled binaries
        if: env.HOUJI_UFS_GPT_COMPILE_CHECK != '1'
        shell: bash
        env:
          HOUJI_ARTIFACT_SECRET: ${{ secrets.HOUJI_PUBLIC_RAM_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/houji-artifact-venv/bin/python" ci/houji-public-ram/artifact.py

      - name: Collect compiler diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          base="$RUNNER_TEMP/houji-public-ram"
          for log in "$base/hakios/base/xnu-deps/"*.log; do
            if [ -f "$log" ]; then
              cp "$log" "evidence/hakios-$(basename "$log")"
            fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: houji-23g90-${{ env.HOUJI_UFS_GPT_COMPILE_CHECK == '1' && 'ufs-gpt-compile' || (inputs.native_volume != '' && 'native-root-offline' || 'ram') }}-kernel-evidence
          path: evidence
          if-no-files-found: error

  firmware:
    if: github.ref_name != 'houji/ios26/ufs-gpt-build-check'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      HOUJI_PUBLIC_REVISION: 98bc0960f96076de8e8d16efcfb0c0603b166b85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the pinned build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang llvm lld make gcc uuid-dev nasm acpica-tools mtools python3-venv hfsprogs
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" -q install cryptography==50.0.2
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: houji-23g90-${{ inputs.native_volume != '' && 'native-root-offline' || 'ram' }}-kernel-evidence
          path: out/kernel-evidence

      - name: Build UEFI, DarwinBoot and the selected payload
        env:
          HOUJI_ARTIFACT_KEY: ${{ secrets.HOUJI_PUBLIC_RAM_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$HOUJI_NATIVE_VOLUME_SEALED" ]]; then
            export HOUJI_NATIVE_VOLUME="$RUNNER_TEMP/native-volume.json"
            export HOUJI_NATIVE_KERNEL="$RUNNER_TEMP/native-kernel.macho"
            umask 077
            python3 ci/houji-public-ram/native-volume-envelope.py --output "$HOUJI_NATIVE_VOLUME"
            python3 ci/houji-public-ram/unseal-native-kernel.py
            umask 022
          fi
          bash ci/houji-public-ram/firmware-build.sh 2>&1 | tee out/firmware-build.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: houji-23g90-${{ inputs.native_volume != '' && 'native-root-offline' || 'ram' }}-firmware-evidence
          path: out/
          if-no-files-found: warn
